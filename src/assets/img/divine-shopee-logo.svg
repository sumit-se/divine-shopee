<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <!-- Lotus petal icon -->
  <g transform="translate(8,30)">
    <!-- Central petal -->
    <ellipse cx="0" cy="-10" rx="5" ry="12" fill="#7f0000" opacity="0.9"/>
    <!-- Left inner petal -->
    <ellipse cx="-8" cy="-6" rx="4" ry="10" fill="#7f0000" opacity="0.75" transform="rotate(-25,-8,-6)"/>
    <!-- Right inner petal -->
    <ellipse cx="8" cy="-6" rx="4" ry="10" fill="#7f0000" opacity="0.75" transform="rotate(25,8,-6)"/>
    <!-- Left outer petal -->
    <ellipse cx="-15" cy="-2" rx="3.5" ry="8" fill="#7f0000" opacity="0.5" transform="rotate(-50,-15,-2)"/>
    <!-- Right outer petal -->
    <ellipse cx="15" cy="-2" rx="3.5" ry="8" fill="#7f0000" opacity="0.5" transform="rotate(50,15,-2)"/>
    <!-- Stem base -->
    <line x1="0" y1="2" x2="0" y2="10" stroke="#7f0000" stroke-width="2" stroke-linecap="round"/>
    <!-- Water line -->
    <line x1="-18" y1="10" x2="18" y2="10" stroke="#7f0000" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Brand name -->
  <text x="40" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#7f0000" letter-spacing="0.5">Divine</text>
  <text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#7f0000" letter-spacing="0.5">Shopee</text>
  <!-- Tagline -->
  <text x="40" y="58" font-family="Arial, sans-serif" font-size="8" fill="#b30000" letter-spacing="1.5" opacity="0.8">ADMINISTRATION</text>
</svg>
