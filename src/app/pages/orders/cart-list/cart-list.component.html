<nb-card class="page-card inner_pages">
  <nb-card-body [nbSpinner]="loadingList" nbSpinnerSize="large" nbSpinnerStatus="primary" class="orderList">
    <div class="inner_pages_legacy">
      <nb-card-header class="main_header">
        <h1 class="page_title">{{ 'COMPONENTS.CARTS' | translate}}</h1>
        <div class="content_spacing_empty"></div>
      </nb-card-header>

      <form class="form-inline filter_section">
        <div class="filter_left_section">
          <label class="status_label" for="cartStatus">{{ 'ORDER.STATUS' | translate }}</label>
          <select id="cartStatus" name="cartStatus" class="form-control status_select" [ngModel]="status"
            (ngModelChange)="onStatusChange($event)">
            <option *ngFor="let s of statuses" [value]="s">
              {{ (s === 'ALL' ? 'ORDER.SHOWALL' : 'CART.' + s) | translate }}
            </option>
          </select>
        </div>
        <div class="filter_right_section" *ngIf="isSuperAdmin">
          <ngx-store-autocomplete (onStore)="onSelectStore($event)"></ngx-store-autocomplete>
        </div>
      </form>

      <ng2-smart-table [settings]="settings" [source]="source" (custom)="route($event)" class="home-table">
      </ng2-smart-table>

      <ngx-paginator (changePage)="changePage($event)" [pagesToShow]="5" [currentPage]="currentPage" [perPage]="perPage"
        [count]="totalCount">
      </ngx-paginator>
    </div>
  </nb-card-body>
</nb-card>
