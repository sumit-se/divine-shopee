user  www-data;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # TLS hardening (applied globally; site configs reference ssl_protocols via include)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Timeouts — tightened to drop slow/stalled connections faster
    keepalive_timeout       30s;
    client_body_timeout     12s;
    client_header_timeout   12s;
    send_timeout            10s;
    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ── Rate limiting zones ──
    # Public API (storefront): 30 requests/min per IP
    limit_req_zone  $binary_remote_addr  zone=api:10m       rate=30r/m;
    # Admin UI API: authenticated users make 5-10 calls per page load — much higher limit
    limit_req_zone  $binary_remote_addr  zone=adminapi:10m  rate=300r/m;
    # Storefront static: 60 requests/min per IP
    limit_req_zone  $binary_remote_addr  zone=shop:10m      rate=60r/m;
    # Admin login: 5 requests/min per IP (brute-force protection)
    limit_req_zone  $binary_remote_addr  zone=adminauth:10m rate=5r/m;
    # Concurrent connections per IP
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
