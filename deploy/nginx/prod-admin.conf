server {
    listen 80;
    server_name admin.divineshopee.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2; # Phase 1: http2 added
    server_name admin.divineshopee.in;

    ssl_certificate /etc/letsencrypt/live/divineshopee.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/divineshopee.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /opt/dsindian/admin/dist;
    index index.html;

    # ── Phase 1: Security headers ──
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

    # ── Phase 1: Connection limit (tighter for admin) ──
    limit_conn perip 10;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Font files have content hashes — no rate limit, cache 1 year
    location ~* \.(woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        limit_req zone=shop burst=30 nodelay;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location = /assets/env.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/v1/auth/ {
        limit_req zone=adminauth burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8080/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 20m;
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
