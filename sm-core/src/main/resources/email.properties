#GMail sample configuration
#May require a keystore for certificates
mailSender.protocol=smtps
mailSender.host=smtp.gmail.com
mailSender.port=465
mailSender.username=youremail@gmail.com
mailSender.password=yourpassword
mailSender.mail.smtp.auth=true
mail.smtp.starttls.enable=true

# JDK 17 no longer allows TLSv1, which is all JavaMail 1.4.7 enables by default:
# every send died with "No appropriate protocol". Naming both prefixes covers
# smtp (starttls) and smtps (implicit SSL on 465).
mailSender.mail.ssl.protocols=TLSv1.2 TLSv1.3
